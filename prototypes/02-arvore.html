<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>guiksr · protótipo 2: árvore</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    .win { transition: opacity 0.16s var(--ease), left var(--dur) var(--ease), top var(--dur) var(--ease); }
  </style>
</head>
<body>
  <main class="desk" id="desk">
    <div class="canvas" id="cv"><svg class="wires" id="wires"></svg></div>
  </main>
  <div class="hint">cada link vira um galho · scroll fora das janelas navega: ↕ próxima/anterior, ↔ pai/filho (ou ← →) · ctrl+scroll dá zoom · esc fecha · 0 = visão geral</div>

  <script src="shared/content.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    // Árvore: nothing gets cut. Every link opened from a window becomes a child one
    // column to the right; siblings stack down in lanes. Depth also nudges each column
    // down a step, so chains read as a diagonal. URL: slug.parentIndex per window.
    const desk = document.getElementById('desk');
    const cv = document.getElementById('cv');
    const wires = document.getElementById('wires');
    const bar = GK.mountBar('02-arvore.html', '<button class="btn" data-fit>visão geral</button>');

    let nodes = []; // { slug, parent, key, x, y }
    const els = new Map(); // key -> element
    let focusKey = null;
    const cam = { x: 0, y: 0, z: 1 };

    function dims() {
      const narrow = innerWidth < 720;
      const W = narrow ? innerWidth - 64 : 480;
      const H = Math.max(320, Math.min(640, Math.floor((innerHeight - 128) / 40) * 40));
      return { narrow, W, H, CW: W + 80, LH: H + 40, SY: 80 };
    }

    function parse() {
      const out = GK.readHash().map((part, i) => {
        const [, slug, p] = part.match(/^(.*?)(?:\.(\d+))?$/);
        let parent = p == null ? 0 : +p;
        if (i === 0) parent = -1;
        else if (parent >= i) parent = 0;
        return { slug, parent };
      });
      if (!out.length) out.push({ slug: 'index', parent: -1 });
      out.forEach((n) => (n.key = n.parent < 0 ? n.slug : out[n.parent].key + '>' + n.slug));
      return out;
    }
    const serialize = () => nodes.map((n, i) => (i === 0 ? n.slug : `${n.slug}.${n.parent}`));

    function layout() {
      const kids = nodes.map(() => []);
      nodes.forEach((n, i) => n.parent >= 0 && kids[n.parent].push(i));
      const pos = [];
      const place = (i, depth, lane) => {
        pos[i] = { depth, lane };
        let next = lane + 1;
        kids[i].forEach((c, k) => {
          next = k === 0 ? Math.max(next, place(c, depth + 1, lane)) : place(c, depth + 1, next);
        });
        return next;
      };
      place(0, 0, 0);
      return { pos, kids };
    }

    function render() {
      const d = dims();
      const { pos, kids } = layout();
      const keep = new Set(nodes.map((n) => n.key));
      for (const [k, el] of els) if (!keep.has(k)) { el.remove(); els.delete(k); }

      const trail = new Set();
      for (let n = nodes.find((n) => n.key === focusKey); n; n = nodes[n.parent]) trail.add(n.key);

      nodes.forEach((n, i) => {
        let el = els.get(n.key);
        if (!el) { el = GK.windowEl(n.slug); cv.appendChild(el); els.set(n.key, el); GK.fadeIn(el); }
        n.x = pos[i].depth * d.CW;
        n.y = pos[i].lane * d.LH + pos[i].depth * d.SY;
        n.lane = pos[i].lane; n.depth = pos[i].depth;
        el.dataset.i = i;
        Object.assign(el.style, { left: n.x + 'px', top: n.y + 'px', width: d.W + 'px', height: d.H + 'px' });
        el.classList.toggle('is-focus', n.key === focusKey);
        el.querySelector('.win-close').hidden = i === 0;

        const open = new Set(kids[i].map((c) => nodes[c].slug));
        const from = n.parent >= 0 ? nodes[n.parent].slug : null;
        el.querySelectorAll('.win-body a[data-slug]').forEach((a) => {
          a.classList.toggle('is-open', open.has(a.dataset.slug));
          a.classList.toggle('is-from', !!a.closest('.backlinks') && a.dataset.slug === from);
        });
        n.onTrail = trail.has(n.key);
      });
      drawWiresFor(400);
    }

    function drawWires() {
      wires.innerHTML = nodes.map((n) => n.parent < 0 ? '' :
        GK.wire(els.get(nodes[n.parent].key), els.get(n.key), n.slug, n.onTrail)).join('');
    }
    function drawWiresFor(ms) {
      const end = performance.now() + ms;
      const tick = () => { drawWires(); if (performance.now() < end) requestAnimationFrame(tick); };
      tick();
    }

    function applyCam(animate) {
      desk.classList.toggle('is-animating', !!animate && !GK.reduced.matches);
      cv.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
      desk.style.backgroundSize = `${40 * cam.z}px ${40 * cam.z}px`;
      desk.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
    }

    function camTo(key, instant) {
      const n = nodes.find((n) => n.key === key);
      if (!n) return;
      const d = dims();
      let sx, sy;
      if (d.narrow) sx = 32;
      else if (n.parent < 0) sx = Math.round((innerWidth - d.W) / 2);
      else sx = Math.max(24, Math.min(innerWidth - d.W - 48, innerWidth / 2 + 40));
      sy = Math.round((innerHeight - d.H) / 2); // focused window is always vertically centered
      cam.z = 1;
      cam.x = Math.round(sx - n.x);
      cam.y = Math.round(sy - n.y);
      applyCam(!instant);
    }

    function fit() {
      const d = dims();
      const minX = Math.min(...nodes.map((n) => n.x)), minY = Math.min(...nodes.map((n) => n.y));
      const maxX = Math.max(...nodes.map((n) => n.x)) + d.W, maxY = Math.max(...nodes.map((n) => n.y)) + d.H;
      cam.z = Math.min(1, (innerWidth - 80) / (maxX - minX), (innerHeight - 72 - 40) / (maxY - minY));
      cam.x = Math.round((innerWidth - (maxX - minX) * cam.z) / 2 - minX * cam.z);
      cam.y = Math.round(72 - minY * cam.z);
      applyCam(true);
    }

    function focusOn(key) {
      focusKey = key;
      render();
      camTo(key);
    }

    function open(i, slug) {
      const n = nodes[i];
      if (n.parent >= 0 && nodes[n.parent].slug === slug) return focusOn(nodes[n.parent].key);
      const key = n.key + '>' + slug;
      if (!nodes.some((m) => m.key === key)) {
        nodes.push({ slug, parent: i, key });
        GK.writeHash(serialize());
      }
      focusOn(key);
      els.get(key).querySelector('.win-body').focus({ preventScroll: true });
    }

    function close(i) {
      const dead = new Set([i]);
      nodes.forEach((n, j) => dead.has(n.parent) && dead.add(j)); // parents always precede children
      const parentKey = nodes[nodes[i].parent].key;
      const remap = new Map();
      nodes = nodes.filter((n, j) => !dead.has(j) && remap.set(j, remap.size))
        .map((n) => ({ ...n, parent: n.parent < 0 ? -1 : remap.get(n.parent) }));
      GK.writeHash(serialize());
      if (nodes.some((n) => n.key === focusKey)) render();
      else focusOn(parentKey);
    }

    function load() {
      nodes = parse();
      GK.writeHash(serialize(), true);
      focusKey = nodes[nodes.length - 1].key;
      render();
    }

    // --- events ---------------------------------------------------------------

    bar.querySelector('[data-fit]').addEventListener('click', fit);

    cv.addEventListener('click', (e) => {
      const win = e.target.closest('.win');
      if (!win) return;
      const i = +win.dataset.i;
      if (e.target.closest('.win-close')) return close(i);
      const a = e.target.closest('a[data-slug]');
      if (a) {
        if (GK.isModified(e)) return;
        e.preventDefault();
        return open(i, a.dataset.slug);
      }
      if (nodes[i].key !== focusKey || cam.z !== 1) focusOn(nodes[i].key);
    });

    cv.addEventListener('focusin', (e) => {
      if (!e.target.matches(':focus-visible')) return; // keyboard only: a mouse focus would pan the desk mid-click
      const win = e.target.closest('.win');
      if (win && nodes[+win.dataset.i].key !== focusKey) focusOn(nodes[+win.dataset.i].key);
    });
    cv.addEventListener('scroll', drawWires, true);
    desk.addEventListener('scroll', () => desk.scrollTo(0, 0));

    desk.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const z = Math.min(1.5, Math.max(0.15, cam.z * Math.exp(-e.deltaY * 0.01)));
        cam.x = e.clientX - (e.clientX - cam.x) * (z / cam.z);
        cam.y = e.clientY - (e.clientY - cam.y) * (z / cam.z);
        cam.z = z;
        return applyCam(false);
      }
      if (e.target.closest('.win-body') && cam.z > 0.75) return;
      e.preventDefault();
      if (cam.z < 1) { // zoomed out: scroll pans the overview
        cam.x -= e.deltaX; cam.y -= e.deltaY;
        return applyCam(false);
      }
      wheelStep(e);
    }, { passive: false });

    // Scroll outside the windows steps through them like the arrow keys:
    // sideways = parent/child, up/down = previous/next window in reading order.
    const wheelStep = GK.wheelStepper((dir) =>
      step({ left: 'parent', right: 'child', up: 'prev', down: 'next' }[dir]));

    function step(dir) {
      const i = nodes.findIndex((n) => n.key === focusKey);
      const n = nodes[i];
      let target;
      if (dir === 'parent') {
        target = nodes[n.parent];
        if (target) target.lastKid = n.key; // → comes back down the same branch
      } else if (dir === 'child') {
        target = nodes.find((m) => m.key === n.lastKid) || nodes.find((m) => m.parent === i);
      } else {
        const order = [...nodes].sort((a, b) => a.lane - b.lane || a.depth - b.depth);
        target = order[order.indexOf(n) + (dir === 'next' ? 1 : -1)];
      }
      if (target) focusOn(target.key);
    }

    addEventListener('keydown', (e) => {
      const i = nodes.findIndex((n) => n.key === focusKey);
      if (e.key === 'ArrowLeft') step('parent');
      else if (e.key === 'ArrowRight') step('child');
      else if (e.key === 'Escape' && i > 0) close(i);
      else if (e.key === '0') fit();
    });

    addEventListener('popstate', () => { load(); camTo(focusKey); });
    addEventListener('resize', () => { render(); camTo(focusKey, true); });

    load();
    camTo(focusKey, true);
    document.fonts.ready.then(drawWires);
  </script>
</body>
</html>
