<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>guiksr</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    /* dark, boxless: the page itself scrolls, narrow text columns float on the night desk */
    :root {
      --night: oklch(0.16 0.008 350);
      --text: oklch(0.9 0.01 350);
      --dim: oklch(0.6 0.012 350);
      --link: oklch(0.82 0.08 350);
      --col: min(360px, 100vw - 48px);
      --gap: 64px;
      --step: calc(var(--col) + var(--gap));
      color-scheme: dark;
    }
    @media (max-width: 720px) { :root { --step: 12px; } }

    html { background: var(--night); }
    html, body { height: auto; overflow-x: clip; }
    body { overflow-y: visible; background: none; color: var(--text); font-size: 13px; line-height: 1.65; }

    .track { position: relative; padding: 30vh 0 75vh; transition: transform 0.5s var(--ease); }

    .leaf {
      width: var(--col);
      margin: 0 0 42vh calc((100vw - var(--col)) / 2 + var(--i) * var(--step));
      opacity: 0.2;
      transition: opacity 0.4s var(--ease);
    }
    .leaf.is-active { opacity: 1; }
    .leaf:not(.is-active) { cursor: pointer; }
    .leaf:not(.is-active):hover { opacity: 0.55; }

    .leaf-meta { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: var(--dim); margin-bottom: 6px; }
    .leaf-meta .path { color: var(--text); }
    .leaf-close { margin-left: auto; border: 0; background: none; color: var(--dim); font-size: 15px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .leaf-close:hover { color: var(--link); }
    .leaf h1 { font: 700 30px/1 var(--display); letter-spacing: -0.02em; margin: 0 0 20px; text-wrap: balance; }
    .leaf[data-kind='home'] h1 { font-size: 40px; color: var(--link); }
    .leaf h2 { font: 700 17px/1.2 var(--display); margin: 20px 0 4px; }
    .leaf p, .leaf ul { margin: 0 0 16px; }
    .leaf li + li { margin-top: 4px; }
    .leaf ul { padding: 0; list-style: none; }
    .leaf li { padding-left: 2ch; text-indent: -2ch; }
    .leaf li::before { content: '→ '; color: var(--dim); }
    .leaf blockquote { font: 600 20px/1.2 var(--display); margin: 18px 0; }
    .leaf blockquote::before { content: '“'; }
    .leaf blockquote::after { content: '”'; }
    .leaf code { background: oklch(0.25 0.01 350); padding: 0 3px; }
    .leaf strong { color: oklch(0.98 0 0); }

    a, .ilink { color: var(--link); }
    .ilink { text-decoration-thickness: 1px; }
    .ilink:hover { background: oklch(0.3 0.04 350); }
    .ilink.is-open, .ilink.is-from { background: var(--link); color: var(--night); }
    .ilink.is-missing { color: var(--dim); }

    .leaf .foto { margin: 24px 0; }
    .leaf .fotos .foto { margin: 0; }
    .leaf .fotos { row-gap: 14px; }
    a.foto.is-open .foto-cap { color: var(--link); }
    .leaf img.foto-img { background: oklch(0.22 0.01 350); }
    .leaf .fotos { grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .leaf .foto-img { border: 0; }
    .leaf .foto-cap { color: var(--dim); font-size: 11px; }
    a.foto:hover .foto-img, a.foto.is-open .foto-img { outline-color: var(--link); }

    .leaf .backlinks { border-top: 0; margin-top: 20px; padding-top: 0; font-size: 12px; }
    .leaf .backlinks h2 { font: 11px/1.4 var(--mono); color: var(--dim); margin: 0 0 4px; }
    .leaf .backlinks li::before { content: '← '; }
    .bl-path { color: var(--dim); font-size: 11px; }

    .trail-end { width: var(--col); font-size: 11px; color: var(--dim); }

    /* site footer: fixed, quiet. mark · trail · sections · copy */
    .sitebar {
      position: fixed; left: 0; right: 0; z-index: 10;
      display: flex; align-items: baseline; gap: 24px;
      padding: 16px 24px;
      font-size: 11px; color: var(--dim);
    }
    .sitebar.top { top: 0; justify-content: space-between; }
    .sitebar.bottom { bottom: 0; }
    .sitebar button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
    .sitebar button:hover { color: var(--text); }
    .sitebar .mark { font: 700 20px/1 var(--display); letter-spacing: -0.02em; color: var(--link); }
    .sitebar .mark:hover { color: var(--text); }
    .crumbs { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, #000 85%, transparent); }
    .crumbs span { opacity: 0.5; }
    .crumbs button.is-active { color: var(--text); }
    .sections { display: flex; gap: 14px; }
    .sections button.is-active { color: var(--link); }
    .sitebar [data-copy] { margin-left: auto; }

    /* where the trail goes from here: previous page up, next page down */
    .ghost {
      position: fixed; z-index: 10;
      left: calc((100vw - var(--col)) / 2); width: var(--col);
      border: 0; background: none; padding: 0; text-align: left;
      font: 11px/1.4 var(--mono); color: var(--dim); cursor: pointer;
      transition: opacity 0.3s var(--ease);
    }
    .ghost b { display: block; font: 700 17px/1.2 var(--display); color: var(--text); opacity: 0.35; transition: opacity 0.2s; }
    .ghost:hover b { opacity: 0.8; }
    .ghost.prev { top: 64px; }
    .ghost.next { bottom: 52px; }
    .ghost:empty { opacity: 0; pointer-events: none; }

    @media (max-width: 720px) {
      .crumbs { display: none; }
      .sitebar { gap: 14px; padding-inline: 16px; }
      .sections { gap: 10px; }
      .ghost { left: 24px; }
    }

    /* no slide/fade on first paint */
    .track:not(.is-ready), .track:not(.is-ready) .leaf { transition: none; }

    .veil { position: fixed; left: 0; right: 0; height: 16vh; pointer-events: none; z-index: 5; }
    .veil.top { top: 0; background: linear-gradient(var(--night) 35%, transparent); }
    .veil.bottom { bottom: 0; background: linear-gradient(transparent, var(--night) 65%); }
  </style>
</head>
<body>
  <main class="track" id="track"></main>
  <div class="veil top"></div>
  <div class="veil bottom"></div>
  <header class="sitebar top">
    <button class="mark" data-go="index">guiksr</button>
    <nav class="sections" aria-label="seções">
      <button data-go="blog">blog</button>
      <button data-go="fotolog">fotolog</button>
      <button data-go="filmes">filmes</button>
      <button data-go="coisas">coisas</button>
      <button data-go="sobre">sobre</button>
    </nav>
  </header>
  <button class="ghost prev" data-ghost="-1"></button>
  <button class="ghost next" data-ghost="1"></button>
  <footer class="sitebar bottom">
    <nav class="crumbs" aria-label="rastro"></nav>
    <button data-copy>copiar link</button>
  </footer>

  <script src="shared/content.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    // Fluxo: escada without windows. The trail is one continuous page of narrow
    // columns; each page sits one column right of the previous and starts where it
    // ends, so the trail reads as a diagonal. URL: same trail as escada.
    const track = document.getElementById('track');
    const P = GK.P;
    const crumbs = document.querySelector('.crumbs');
    const ghosts = document.querySelectorAll('.ghost');

    let stack = [], leaves = [], focus = 0;
    const end = document.createElement('footer');
    end.className = 'trail-end';
    end.innerHTML = 'fim do rastro · <a href="#" data-top>voltar ao começo ↑</a>';

    function leafEl(slug) {
      const page = P[slug] || {
        title: 'ainda não existe', kind: 'vazio',
        body: 'a página `/' + slug + '` ainda não foi escrita.',
      };
      const bl = GK.backlinks[slug] || [];
      const el = document.createElement('article');
      el.className = 'leaf';
      el.dataset.slug = slug;
      el.dataset.kind = page.kind;
      el.innerHTML = `
        <div class="leaf-meta">
          <span class="path">/${GK.esc(GK.pathOf(slug))}</span>
          <span>${page.kind}${page.date ? ' · ' + page.date : ''}</span>
          <button class="leaf-close" aria-label="fechar daqui pra frente">×</button>
        </div>
        <h1>${GK.esc(page.title)}</h1>
        ${GK.md(page.body)}
        ${bl.length ? `<footer class="backlinks"><h2>linkado por</h2><ul>${bl.map((s) =>
          `<li><a class="ilink" href="#${s}" data-slug="${s}">${GK.esc(P[s].title)}</a> <span class="bl-path">/${GK.pathOf(s)}</span></li>`).join('')}</ul></footer>` : ''}`;
      return el;
    }

    function render() {
      leaves.splice(stack.length).forEach((el) => el.remove());
      stack.forEach((slug, i) => {
        if (leaves[i] && leaves[i].dataset.slug === slug) return;
        if (leaves[i]) leaves[i].remove();
        leaves[i] = leafEl(slug);
        track.insertBefore(leaves[i], leaves[i + 1] || null);
      });
      leaves.forEach((el, i) => {
        el.dataset.i = i;
        el.style.setProperty('--i', i);
        el.querySelector('.leaf-close').hidden = stack.length === 1;
        el.querySelectorAll('a[data-slug]').forEach((a) => {
          const inBL = !!a.closest('.backlinks');
          a.classList.toggle('is-open', !inBL && a.dataset.slug === stack[i + 1]);
          a.classList.toggle('is-from', inBL && a.dataset.slug === stack[i - 1]);
        });
      });
      track.appendChild(end);
      end.style.marginLeft = `calc((100vw - var(--col)) / 2 + ${stack.length - 1} * var(--step))`;
      frame();
    }

    // The active page is the last one whose top has crossed the reading line (40%
    // down). The track slides so the active column is centered; the rest fade.
    function frame() {
      const line = scrollY + innerHeight * 0.4;
      let active = 0;
      leaves.forEach((el, i) => { if (el.offsetTop <= line) active = i; });
      leaves.forEach((el, i) => el.classList.toggle('is-active', i === active));
      if (leaves.length) track.style.transform = `translateX(${leaves[0].offsetLeft - leaves[active].offsetLeft}px)`;
      focus = active;
      paintBar();
    }

    function paintBar() {
      crumbs.innerHTML = stack.map((slug, i) =>
        `${i ? '<span>→</span>' : ''}<button data-crumb="${i}" class="${i === focus ? 'is-active' : ''}">${GK.esc(P[slug]?.title || slug)}</button>`).join('');
      document.querySelectorAll('[data-go]').forEach((b) => b.classList.toggle('is-active', stack[focus] === b.dataset.go));
      ghosts.forEach((g) => {
        const slug = stack[focus + +g.dataset.ghost];
        const label = g.dataset.ghost < 0 ? '↑ veio de' : '↓ segue pra';
        g.innerHTML = slug ? `${label}<b>${GK.esc(P[slug]?.title || slug)}</b>` : '';
      });
      const page = P[stack[focus]];
      document.title = page && stack[focus] !== 'index' ? `${page.title} · guiksr` : 'guiksr';
    }

    // Center the page vertically. Tall pages start near the top instead; short ones
    // never sit below the reading line, so they still become active.
    function scrollToLeaf(i, instant) {
      const el = leaves[i];
      if (!el) return;
      const vh = innerHeight;
      const top = Math.max(80, Math.min((vh - el.offsetHeight) / 2, vh * 0.38));
      scrollTo({ top: el.offsetTop - top, behavior: instant || GK.reduced.matches ? 'auto' : 'smooth' });
    }

    function open(i, slug) {
      if (stack[i - 1] === slug) return scrollToLeaf(i - 1);
      if (stack[i + 1] === slug) return scrollToLeaf(i + 1);
      stack = stack.slice(0, i + 1).concat(slug);
      GK.writeHash(stack);
      render();
      scrollToLeaf(stack.length - 1);
    }

    function close(i) {
      stack = stack.slice(0, Math.max(1, i));
      GK.writeHash(stack);
      render();
      scrollToLeaf(stack.length - 1);
    }

    function load() {
      stack = GK.readHash();
      if (!stack.length) { stack = ['index']; GK.writeHash(stack, true); }
      render();
    }

    // --- events ---------------------------------------------------------------

    track.addEventListener('click', (e) => {
      if (e.target.closest('[data-top]')) { e.preventDefault(); return scrollToLeaf(0); }
      const leaf = e.target.closest('.leaf');
      if (!leaf) return;
      const i = +leaf.dataset.i;
      if (e.target.closest('.leaf-close')) return close(i);
      const a = e.target.closest('a[data-slug]');
      if (a) { if (!GK.isModified(e)) { e.preventDefault(); open(i, a.dataset.slug); } return; }
      if (!leaf.classList.contains('is-active') && !getSelection().toString()) scrollToLeaf(i);
    });

    // footer: a section already on the trail gets focused; otherwise it opens after
    // the page you're reading, same as clicking a link in it
    document.addEventListener('click', async (e) => {
      if (e.target.closest('.track')) return;
      const ghost = e.target.closest('[data-ghost]');
      if (ghost) return scrollToLeaf(focus + +ghost.dataset.ghost);
      const go = e.target.closest('[data-go]'), crumb = e.target.closest('[data-crumb]');
      if (go) {
        const i = stack.indexOf(go.dataset.go);
        return i >= 0 ? scrollToLeaf(i) : open(focus, go.dataset.go);
      }
      if (crumb) return scrollToLeaf(+crumb.dataset.crumb);
      const copy = e.target.closest('[data-copy]');
      if (copy) {
        try { await navigator.clipboard.writeText(location.href); copy.textContent = 'copiado'; }
        catch { prompt('copia esse link:', location.href); }
        setTimeout(() => (copy.textContent = 'copiar link'), 1200);
      }
    });

    let ticking = false;
    addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { frame(); ticking = false; });
    }, { passive: true });
    addEventListener('resize', frame);

    addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && stack.length > 1) close(stack.length - 1);
    });
    addEventListener('popstate', () => { load(); scrollToLeaf(stack.length - 1, true); });

    history.scrollRestoration = 'manual';
    load();
    scrollToLeaf(stack.length - 1, true);
    document.fonts.ready.then(() => {
      scrollToLeaf(stack.length - 1, true);
      frame();
      requestAnimationFrame(() => track.classList.add('is-ready'));
    });
  </script>
</body>
</html>
