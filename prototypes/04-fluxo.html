<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>guiksr</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    /* dark, boxless: the page itself scrolls, narrow text columns float on the night desk */
    :root {
      --night: oklch(0.16 0.008 350);
      --text: oklch(0.9 0.01 350);
      --dim: oklch(0.6 0.012 350);
      --link: oklch(0.82 0.08 350);
      --col: min(360px, 100vw - 48px);
      --gap: 64px;
      --step: calc(var(--col) + var(--gap));
      color-scheme: dark;
    }
    @media (max-width: 720px) { :root { --step: 12px; } }

    html { background: var(--night); }
    html, body { height: auto; overflow-x: clip; }
    body { overflow-y: visible; background: none; color: var(--text); font-size: 13px; line-height: 1.65; }

    .track { position: relative; padding: 30vh 0 75vh; will-change: transform; }

    .leaf {
      width: var(--col);
      margin: 0 0 42vh calc((100vw - var(--col)) / 2 + var(--i) * var(--step));
      opacity: 0.2; /* set per frame from the scroll position */
    }
    .leaf { position: relative; }
    .leaf:not(.is-active) { cursor: pointer; }
    .leaf:not(.is-active):hover { opacity: 0.55 !important; }

    .leaf-meta { display: flex; align-items: baseline; gap: 8px; font-size: 11px; color: var(--dim); margin-bottom: 6px; }
    .leaf-meta .path { color: var(--text); }
    .leaf-close { margin-left: auto; border: 0; background: none; color: var(--dim); font-size: 15px; line-height: 1; cursor: pointer; padding: 0 2px; }
    .leaf-close:hover { color: var(--link); }
    .leaf h1 { font: 700 30px/1 var(--display); letter-spacing: -0.02em; margin: 0 0 20px; text-wrap: balance; }
    .leaf[data-kind='home'] h1 { font-size: 40px; color: var(--link); }
    .leaf h2 { font: 700 17px/1.2 var(--display); margin: 20px 0 4px; }
    .leaf p, .leaf ul { margin: 0 0 16px; }
    .leaf li + li { margin-top: 4px; }
    .leaf ul { padding: 0; list-style: none; }
    .leaf li { padding-left: 2ch; text-indent: -2ch; }
    .leaf li::before { content: '→ '; color: var(--dim); }
    .leaf blockquote { font: 600 20px/1.2 var(--display); margin: 18px 0; }
    .leaf blockquote::before { content: '“'; }
    .leaf blockquote::after { content: '”'; }
    .leaf code { background: oklch(0.25 0.01 350); padding: 0 3px; }
    .leaf strong { color: oklch(0.98 0 0); }

    a, .ilink { color: var(--link); }
    .ilink { text-decoration-thickness: 1px; }
    .ilink:hover { background: oklch(0.3 0.04 350); }
    .ilink.is-open, .ilink.is-from { background: var(--link); color: var(--night); }
    .ilink.is-missing { color: var(--dim); }

    .leaf .photo { margin: 24px 0; }
    .leaf .photos .photo { margin: 0; }
    .leaf .photos { row-gap: 14px; }
    a.photo.is-open .photo-cap { color: var(--link); }
    .leaf img.photo-img { background: oklch(0.22 0.01 350); }
    .leaf .photos { grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .leaf .photo-img { border: 0; }
    .leaf .photo-cap { color: var(--dim); font-size: 11px; }
    a.photo:hover .photo-img, a.photo.is-open .photo-img { outline-color: var(--link); }

    .leaf .backlinks { border-top: 0; margin-top: 20px; padding-top: 0; font-size: 12px; }
    .leaf .backlinks h2 { font: 11px/1.4 var(--mono); color: var(--dim); margin: 0 0 4px; }
    .leaf .backlinks li::before { content: '← '; }
    .bl-path { color: var(--dim); font-size: 11px; }


    /* header and footer: fixed, quiet. mark + sections on top; trail + back to start below */
    .sitebar {
      position: fixed; left: 0; right: 0; z-index: 10;
      display: flex; align-items: baseline; gap: 24px;
      padding: 16px 24px;
      font-size: 11px; color: var(--dim);
    }
    .sitebar.top { top: 0; justify-content: space-between; }
    .sitebar.bottom { bottom: 0; }
    .sitebar button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
    .sitebar button:hover { color: var(--text); }
    .sitebar .mark { font: 700 20px/1 var(--display); letter-spacing: -0.02em; color: var(--link); }
    .sitebar .mark:hover { color: var(--text); }
    .crumbs { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, #000 85%, transparent); }
    .crumbs span { opacity: 0.5; }
    .crumbs button.is-active { color: var(--text); }
    .sections { display: flex; gap: 14px; }
    .sections button.is-active { color: var(--link); }
    .sitebar [data-top] { margin-left: auto; }

    /* margin lanes on both sides of the column: a gutter, then an annotation lane
       (::left, ::right, ::facts, veio de/segue pra) */
    :root { --gutter: 56px; --lane: 220px; }

    /* where the trail goes from here, in the left lane: veio de level with the top of
       the page, segue pra level with its end. A ::left in between is
       respected like image and note on the right: nothing overlaps, things push down. */
    .trail-nav {
      position: absolute; right: calc(100% + var(--gutter)); width: var(--lane);
      border: 0; background: none; padding: 0; text-align: right;
      font: 11px/1.4 var(--mono); color: var(--dim); cursor: pointer;
    }
    .trail-nav.prev { top: 0; }
    .trail-nav.next { bottom: 0; }
    .trail-nav b { display: block; font: 700 17px/1.2 var(--display); color: var(--text); opacity: 0.4; transition: opacity 0.2s; }
    .trail-nav:hover b { opacity: 0.85; }
    .trail-nav[hidden] { display: none; }

    /* beside the text: ::right and ::facts sit in the right lane, ::left in the left
       one, at the height where they appear in the markdown */
    .leaf .side { position: absolute; left: calc(100% + var(--gutter)); width: var(--lane); margin: 4px 0 0; color: var(--dim); font-size: 11px; }
    .leaf .side.left { left: auto; right: calc(100% + var(--gutter)); text-align: right; }
    .leaf .side p { margin: 0 0 8px; }
    .leaf .side .photo { margin: 0 0 6px; }
    .leaf .facts dl { gap: 3px 14px; }
    .leaf .facts dt { color: var(--dim); }
    .leaf .facts dd { color: var(--text); }


    /* photos open full screen; linked photos (fotolog grid) navigate instead */
    .leaf figure.photo img { cursor: zoom-in; }
    .lightbox {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: oklch(0.12 0.008 350 / 0.94); cursor: zoom-out;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img { display: block; transform-origin: 0 0; background: oklch(0.22 0.01 350); }
    .lightbox p { margin: 0; font-size: 11px; color: var(--dim); min-height: 1lh; }

    @media (max-width: 1000px) {
      .trail-nav { position: static; display: block; width: auto; text-align: left; }
      .trail-nav.prev { margin: 0 0 18px; }
      .trail-nav.next { margin: 28px 0 0; }
      .leaf .side, .leaf .side.left { position: static; width: auto; text-align: left; margin: 0 0 16px; }
    }

    @media (max-width: 720px) {
      .crumbs { display: none; }
      .sitebar { gap: 14px; padding-inline: 16px; }
      .sections { gap: 10px; }
    }

    .sitebar button { transition: color 0.3s var(--ease); }

    /* a page arriving: its blocks surface one by one */
    @keyframes surface { from { opacity: 0; transform: translateY(12px); } }
    .leaf.is-entering > * { animation: surface 0.9s var(--ease) both; animation-delay: calc(180ms + var(--k) * 55ms); }
    /* a page leaving: everything dissolves upward together */
    @keyframes dissolve { to { opacity: 0; transform: translateY(-8px); } }
    .leaf.is-leaving > * { animation: dissolve 0.32s cubic-bezier(0.4, 0, 1, 1) both; }

    /* photos fade in as they load instead of popping */
    .leaf img.photo-img { opacity: 0; transition: opacity 0.9s var(--ease); }
    .leaf img.photo-img.is-loaded { opacity: 1; }

    .veil { position: fixed; left: 0; right: 0; height: 16vh; pointer-events: none; z-index: 5; }
    .veil.top { top: 0; background: linear-gradient(var(--night) 35%, transparent); }
    .veil.bottom { bottom: 0; background: linear-gradient(transparent, var(--night) 65%); }
  </style>
</head>
<body>
  <main class="track" id="track"></main>
  <div class="lightbox" hidden><img alt=""><p></p></div>
  <div class="veil top"></div>
  <div class="veil bottom"></div>
  <header class="sitebar top">
    <button class="mark" data-go="index">guiksr</button>
    <nav class="sections" aria-label="seções">
      <button data-go="blog">blog</button>
      <button data-go="fotolog">fotolog</button>
      <button data-go="filmes">filmes</button>
      <button data-go="coisas">coisas</button>
      <button data-go="sobre">sobre</button>
    </nav>
  </header>
  <footer class="sitebar bottom">
    <nav class="crumbs" aria-label="rastro"></nav>
    <button data-top hidden>voltar ao começo ↑</button>
  </footer>

  <script src="shared/content.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    // Fluxo: escada without windows. The trail is one continuous page of narrow
    // columns; each page sits one column right of the previous and starts where it
    // ends, so the trail reads as a diagonal. URL: same trail as escada.
    const track = document.getElementById('track');
    const P = GK.P;
    const crumbs = document.querySelector('.crumbs');
    const toTop = document.querySelector('[data-top]');

    let stack = [], leaves = [], focus = 0;

    function leafEl(slug) {
      const page = P[slug] || {
        title: 'ainda não existe', kind: 'vazio',
        body: 'a página `/' + slug + '` ainda não foi escrita.',
      };
      const bl = GK.backlinks[slug] || [];
      const el = document.createElement('article');
      el.className = 'leaf';
      el.dataset.slug = slug;
      el.dataset.kind = page.kind;
      el.innerHTML = `
        <div class="leaf-meta">
          <span class="path">/${GK.esc(GK.pathOf(slug))}</span>
          <span>${page.kind}${page.date ? ' · ' + page.date : ''}</span>
          <button class="leaf-close" aria-label="fechar daqui pra frente">×</button>
        </div>
        <button class="trail-nav prev" hidden></button>
        <h1>${GK.esc(page.title)}</h1>
        ${GK.md(page.body)}
        ${bl.length ? `<footer class="backlinks"><h2>linkado por</h2><ul>${bl.map((s) =>
          `<li><a class="ilink" href="#${s}" data-slug="${s}">${GK.esc(P[s].title)}</a> <span class="bl-path">/${GK.pathOf(s)}</span></li>`).join('')}</ul></footer>` : ''}
        <button class="trail-nav next" hidden></button>`;
      return el;
    }

    function render() {
      leaves.splice(stack.length).forEach((el) => el.remove());
      stack.forEach((slug, i) => {
        if (leaves[i] && leaves[i].dataset.slug === slug) return;
        if (leaves[i]) leaves[i].remove();
        leaves[i] = leafEl(slug);
        track.insertBefore(leaves[i], leaves[i + 1] || null);
        leaves[i].querySelectorAll('img').forEach((img) => {
          const done = () => img.classList.add('is-loaded');
          if (img.complete) done(); else { img.addEventListener('load', done); img.addEventListener('error', done); }
        });
      });
      leaves.forEach((el, i) => {
        el.dataset.i = i;
        el.style.setProperty('--i', i);
        el.querySelector('.leaf-close').hidden = stack.length === 1;
        el.querySelectorAll('a[data-slug]').forEach((a) => {
          const inBL = !!a.closest('.backlinks');
          a.classList.toggle('is-open', !inBL && a.dataset.slug === stack[i + 1]);
          a.classList.toggle('is-from', inBL && a.dataset.slug === stack[i - 1]);
        });
      });
      leaves.forEach((el, i) => {
        // each page names its neighbours on the trail
        for (const [cls, j, label] of [['prev', i - 1, '↑ veio de'], ['next', i + 1, '↓ segue pra']]) {
          const b = el.querySelector(`.trail-nav.${cls}`), slug = stack[j];
          b.hidden = !slug;
          b.dataset.goto = j;
          if (slug) b.innerHTML = `${label}<b>${GK.esc(P[slug]?.title || slug)}</b>`;
        }
      });
      focus = -1; // force the bar to repaint
      shown.length = 0;
      measure();
    }

    // --- motion -------------------------------------------------------------------
    // Native scroll drives everything; nothing is animated on its own. f is your
    // position along the trail: a whole number while you read a page, fractional
    // while you cross the gap to the next one. The track slides and the pages
    // crossfade from f, so scrolling through a gap *is* the diagonal move.
    // Layout is measured once (and on resize/load), never during scroll.
    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const CROSS = 0.34; // the crossing takes the last 34vh of scroll before a page's rest point

    // Three columns: the main column sets the page's height; the side columns live
    // inside it. Each side item wants to sit at the height where it appears in the
    // text. veio de is pinned to the top, segue pra to the end of the main content
    // (linkado por, if there is one). Items never overlap (16px apart) and never run
    // past the end: going down the lane they're pushed below the one above, then going
    // up from the end they're pulled back inside. Only a lane that can't fit at all
    // overflows downward. Lanes fold into the text on narrow screens; nothing moves.
    const LANES = [
      '.trail-nav.prev:not([hidden]), .side.left, .trail-nav.next:not([hidden])',
      '.side.right',
    ];
    const GAP = 16;

    function settleLanes(leaf) {
      const H = leaf.offsetHeight;
      for (const sel of LANES) {
        const items = [...leaf.querySelectorAll(sel)].filter((el) => {
          if (getComputedStyle(el).position === 'absolute') return true;
          el.style.translate = '';
          return false;
        }).map((el) => ({
          el, top: el.offsetTop, h: el.offsetHeight,
          pin: el.classList.contains('prev') ? 'top' : el.classList.contains('next') ? 'end' : null,
        }));
        // down: no overlaps
        let floor = 0;
        for (const it of items) {
          it.y = Math.max(it.pin === 'end' ? H - it.h : it.top, floor);
          floor = it.y + it.h + GAP;
        }
        const pushed = items.map((it) => it.y);
        // up from the end: pull back inside the page
        let limit = H;
        for (let k = items.length - 1; k >= 0 && items[k].pin !== 'top'; k--) {
          items[k].y = Math.min(items[k].y, limit - items[k].h);
          limit = items[k].y - GAP;
        }
        // the lane is taller than the page: keep the pushed-down layout instead
        const fits = items.every((it, k) => it.y >= 0 && (k === 0 || it.y >= items[k - 1].y + items[k - 1].h + GAP));
        items.forEach((it, k) => {
          const dy = (fits ? it.y : pushed[k]) - it.top;
          it.el.style.translate = dy ? `0 ${dy}px` : '';
        });
      }
    }

    let m = []; // per page: { anchor (scrollY where it rests), x (column offset) }
    function measure() {
      const vh = innerHeight;
      leaves.forEach(settleLanes);
      m = leaves.map((el) => {
        const h = el.offsetHeight;
        return { anchor: el.offsetTop - Math.max(80, Math.min((vh - h) / 2, vh * 0.38)), x: el.offsetLeft };
      });
      // end the document exactly where the last page rests: no empty scroll after it
      const pad = parseFloat(track.style.paddingBottom) || 0;
      const content = track.offsetHeight - pad;
      if (m.length) track.style.paddingBottom = `${Math.max(24, Math.ceil(m[m.length - 1].anchor + vh - content))}px`;
      kick();
    }
    new ResizeObserver(measure).observe(track);

    function trailPos() {
      const y = scrollY;
      let i = 0;
      while (m[i + 1] && y >= m[i + 1].anchor) i++;
      if (!m[i + 1]) return i;
      const next = m[i + 1].anchor, start = next - innerHeight * CROSS;
      return y <= start ? i : i + easeInOut((y - start) / (next - start));
    }

    let raf = 0;
    const kick = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (m.length) paint(trailPos()); }); };

    const shown = []; // last opacity written per page, to skip no-op writes
    function paint(f) {
      const i = Math.min(Math.floor(f), m.length - 1), t = f - i;
      const x = m[i].x + ((m[i + 1] ? m[i + 1].x : m[i].x) - m[i].x) * t;
      track.style.transform = `translate3d(${(m[0].x - x).toFixed(1)}px, 0, 0)`;
      leaves.forEach((el, j) => {
        const o = (0.2 + 0.8 * Math.max(0, 1 - Math.abs(f - j))).toFixed(2);
        if (shown[j] !== o) { el.style.opacity = o; shown[j] = o; }
      });
      const active = Math.round(f);
      if (active !== focus) {
        focus = active;
        leaves.forEach((el, j) => el.classList.toggle('is-active', j === active));
        paintBar();
      }
    }

    function paintBar() {
      crumbs.innerHTML = stack.map((slug, i) =>
        `${i ? '<span>→</span>' : ''}<button data-crumb="${i}" class="${i === focus ? 'is-active' : ''}">${GK.esc(P[slug]?.title || slug)}</button>`).join('');
      document.querySelectorAll('[data-go]').forEach((b) => b.classList.toggle('is-active', stack[focus] === b.dataset.go));
      toTop.hidden = focus <= 0;
      const page = P[stack[focus]];
      document.title = page && stack[focus] !== 'index' ? `${page.title} · guiksr` : 'guiksr';
    }

    // clicks use the browser's own smooth scroll
    function scrollToLeaf(i, instant) {
      if (!leaves[i]) return;
      if (!m[i]) measure();
      scrollTo({ top: m[i].anchor, behavior: instant || GK.reduced.matches ? 'auto' : 'smooth' });
    }

    function enter(el) {
      if (GK.reduced.matches) return;
      [...el.children].forEach((c, k) => c.style.setProperty('--k', k));
      el.classList.add('is-entering');
      setTimeout(() => el.classList.remove('is-entering'), 1800);
    }

    // pages being cut from the trail dissolve before they go
    function leave(from, then) {
      const going = leaves.slice(from);
      if (!going.length || GK.reduced.matches) return then();
      going.forEach((el) => el.classList.add('is-leaving'));
      setTimeout(then, 320);
    }

    let busy = false;
    function open(i, slug) {
      if (busy) return;
      if (stack[i - 1] === slug) return scrollToLeaf(i - 1);
      if (stack[i + 1] === slug) return scrollToLeaf(i + 1);
      busy = true;
      leave(i + 1, () => {
        stack = stack.slice(0, i + 1).concat(slug);
        GK.writeHash(stack);
        render();
        enter(leaves[leaves.length - 1]);
        scrollToLeaf(stack.length - 1);
        busy = false;
      });
    }

    function close(i) {
      if (busy) return;
      busy = true;
      leave(Math.max(1, i), () => {
        stack = stack.slice(0, Math.max(1, i));
        GK.writeHash(stack);
        render();
        scrollToLeaf(stack.length - 1);
        busy = false;
      });
    }

    function load() {
      stack = GK.readHash();
      if (!stack.length) { stack = ['index']; GK.writeHash(stack, true); }
      render();
    }

    // --- events ---------------------------------------------------------------

    track.addEventListener('click', (e) => {
      const pic = e.target.closest('figure.photo img');
      if (pic) return openImage(pic);
      const nav = e.target.closest('.trail-nav');
      if (nav) return scrollToLeaf(+nav.dataset.goto);
      const leaf = e.target.closest('.leaf');
      if (!leaf) return;
      const i = +leaf.dataset.i;
      if (e.target.closest('.leaf-close')) return close(i);
      const a = e.target.closest('a[data-slug]');
      if (a) { if (!GK.isModified(e)) { e.preventDefault(); open(i, a.dataset.slug); } return; }
      if (!leaf.classList.contains('is-active') && !getSelection().toString()) scrollToLeaf(i);
    });

    // header/footer: a section already on the trail gets focused; otherwise it opens
    // after the page you're reading, same as clicking a link in it
    document.addEventListener('click', (e) => {
      if (e.target.closest('.track')) return;
      if (e.target.closest('[data-top]')) return scrollToLeaf(0);
      const go = e.target.closest('[data-go]'), crumb = e.target.closest('[data-crumb]');
      if (go) {
        const i = stack.indexOf(go.dataset.go);
        return i >= 0 ? scrollToLeaf(i) : open(focus, go.dataset.go);
      }
      if (crumb) return scrollToLeaf(+crumb.dataset.crumb);
    });

    addEventListener('scroll', kick, { passive: true });
    addEventListener('resize', measure);

    // --- lightbox ---------------------------------------------------------------
    // The photo grows out of its spot in the text (FLIP on one element), then swaps
    // to a sharper copy sized for the screen. Click, Esc or scrolling closes it.
    const lb = document.querySelector('.lightbox'), lbImg = lb.querySelector('img'), lbCap = lb.querySelector('p');
    const EASE = 'cubic-bezier(0.2, 0.7, 0.2, 1)';
    let lbFrom = null;

    // gatinho URLs are /<w>/<h>[/<id>]: ask for the size we'll actually show
    function sharper(src, w, h) {
      const m = src.match(/^(https?:\/\/[^/]+)\/(\d+)\/(\d+)(\/\d+)?$/);
      if (!m) return src;
      const k = Math.min(2400 / Math.max(+m[2], +m[3]), (w * devicePixelRatio) / +m[2]);
      return k > 1 ? `${m[1]}/${Math.round(m[2] * k)}/${Math.round(m[3] * k)}${m[4] || ''}` : src;
    }

    function openImage(img) {
      const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
      const s = Math.min((innerWidth * 0.9) / nw, (innerHeight * 0.82) / nh);
      const w = Math.round(nw * s), h = Math.round(nh * s);
      lbFrom = img;
      lbImg.src = img.currentSrc || img.src;
      Object.assign(lbImg.style, { width: w + 'px', height: h + 'px' });
      lbCap.textContent = img.alt;
      lb.hidden = false;
      const big = new Image();
      big.onload = () => { if (lbFrom === img) lbImg.src = big.src; };
      big.src = sharper(img.src, w, h);
      if (GK.reduced.matches) return;
      const from = img.getBoundingClientRect(), to = lbImg.getBoundingClientRect();
      lbImg.animate([{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width})` }, { transform: 'none' }],
        { duration: 420, easing: EASE });
      lb.animate([{ backgroundColor: 'transparent' }, {}], { duration: 420, easing: EASE });
      lbCap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 200, fill: 'backwards' });
    }

    function closeImage(fly = true) {
      if (lb.hidden) return;
      const img = lbFrom;
      lbFrom = null;
      const done = () => { lb.hidden = true; lbImg.removeAttribute('src'); };
      if (GK.reduced.matches) return done();
      const from = img.getBoundingClientRect(), to = lbImg.getBoundingClientRect();
      const onScreen = fly && from.bottom > 0 && from.top < innerHeight;
      lb.animate([{}, { backgroundColor: 'transparent' }], { duration: 300, easing: EASE, fill: 'forwards' }).onfinish = (a) => { done(); a.target.cancel(); };
      lbCap.animate([{}, { opacity: 0 }], { duration: 150, fill: 'forwards' }).onfinish = (a) => a.target.cancel();
      lbImg.animate(onScreen
        ? [{}, { transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width})` }]
        : [{}, { opacity: 0 }], { duration: 300, easing: EASE, fill: 'forwards' }).onfinish = (a) => a.target.cancel();
    }

    lb.addEventListener('click', () => closeImage());
    addEventListener('scroll', () => closeImage(false), { passive: true });

    addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!lb.hidden) return closeImage();
      if (stack.length > 1) close(stack.length - 1);
    });
    addEventListener('popstate', () => { load(); scrollToLeaf(stack.length - 1, true); });

    history.scrollRestoration = 'manual';
    load();
    scrollToLeaf(stack.length - 1, true);
    document.fonts.ready.then(() => { measure(); scrollToLeaf(stack.length - 1, true); });
  </script>
</body>
</html>
